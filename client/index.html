<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b7f78" />
    <script>
      // apply the saved look before the app loads (no flash of the other theme)
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <meta name="description" content="Appointments and bookings for clinics, gyms, salons and every schedule-based business." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- "Add to Home Screen" opens it full screen like an app (iPhone without the App Store, too) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Programo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Programo · Appointments</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
