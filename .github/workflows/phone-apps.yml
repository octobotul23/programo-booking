# Builds the Android app (APK) and checks the iOS app compiles, on GitHub's computers.
# Nothing to install locally. Run it from GitHub: Actions → "Phone apps" → Run workflow,
# type your server's address, then download "programo-android" from the finished run ("Artifacts").
#
# Optional, for a signed release APK (needed for Google Play, and so updates install over each other):
# add the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and, only if the
# key has its own password, ANDROID_KEY_PASSWORD; and the repository variable ANDROID_CERT_SHA256 (the certificate's
# fingerprint), so a wrongly signed APK fails. See DEPLOY.md → "Phone apps". Without a key you get a debug APK.
#
# The key never meets the project's code: the "build" job compiles without any secrets, and the "sign" job runs
# no repository or npm code at all, only the Android SDK's own apksigner. Every action is pinned to a commit.
name: Phone apps

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Server address the apps open (https://your.domain, or http://pc-name.tailnet.ts.net:3000)
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # refuses a tampered gradle-wrapper.jar before it runs
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # no install scripts: nothing here needs them, and they are where npm attacks run
      - run: npm ci --ignore-scripts
      # the address goes in through the environment, never pasted into the script (no injection)
      - run: node mobile/configure.mjs "$APP_URL"
        env:
          APP_URL: ${{ inputs.app_url }}
      - name: Build the APKs (release unsigned, and debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: in
      - name: Sign with the release key (or hand over the debug APK)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir out
          release=$(find in -name app-release-unsigned.apk | head -1)
          debug=$(find in -name app-debug.apk | head -1)
          # the expected certificate: 64 hex digits, or as keytool prints it ("SHA-256: 26:DC:…"); of a colon run the
          # last 32 pairs, so the "256" of a label written as "SHA256:26:DC:…" is not taken for part of it
          want=$(printf '%s' "${EXPECTED_SHA256:-}" | grep -oiE '([0-9a-f]{2}:)+[0-9a-f]{2}|\b[0-9a-f]{64}\b' \
            | awk -F: 'NF >= 32 { s = ""; for (i = NF - 31; i <= NF; i++) s = s $i; print s; exit } NF == 1 && length($0) == 64 { print; exit }' \
            | tr 'A-F' 'a-f' || true)
          if [ -n "${EXPECTED_SHA256:-}" ] && [ -z "$want" ]; then
            echo "::error::The ANDROID_CERT_SHA256 variable is not a SHA-256 fingerprint (64 hex digits)."
            exit 1
          fi
          if [ -z "${KEYSTORE_B64:-}" ]; then
            if [ -n "$want" ]; then
              echo "::warning::ANDROID_CERT_SHA256 is set, but the ANDROID_KEYSTORE_BASE64 secret did not reach this job (missing, misnamed, or saved as an environment secret). This run gives a debug APK, not a release."
            else
              echo "::notice::No signing key in the repository secrets: this run gives a debug APK."
            fi
            cp "$debug" out/Programo-debug.apk
            exit 0
          fi
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          export KEY_PASS="${KEY_PASS:-$KS_PASS}"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/programo.jks"
          "$tools/zipalign" -f -p 4 "$release" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/programo.jks" --ks-key-alias "${KEY_ALIAS:-programo}" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out out/Programo.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/programo.jks"
          sha=$("$tools/apksigner" verify --print-certs out/Programo.apk | sed -n 's/.*SHA-256 digest: //p' | head -1)
          echo "Signed by certificate SHA-256 $sha"
          if [ -n "$want" ] && [ "$sha" != "$want" ]; then
            echo "::error::Signed with an unexpected certificate (expected $want)."
            rm -f out/Programo.apk
            exit 1
          fi
      - name: Remove the key file even if signing failed
        if: always()
        run: rm -f "$RUNNER_TEMP/programo.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: programo-android
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node mobile/configure.mjs "$APP_URL"
        env:
          APP_URL: ${{ inputs.app_url }}
      # proves the iPhone app builds. Installing it on iPhones needs an Apple Developer account
      # (signing + TestFlight) — see DEPLOY.md → "Phone apps → iPhone".
      - name: Build for the iOS simulator (no signing)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
